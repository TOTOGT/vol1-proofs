name = "Vol1"
version = "0.2.0"

# One target, because there is one file.
#
# Theorem53NonCommutativity.lean was briefly added here as a second target.
# It is a strict subset of PrincipiaVol1.lean: its seven theorems --
# foldMap_not_odd, nonCommutativity_instance, nonCommutativity_nondegenerate,
# commuting_instance, exists_order_dependent, not_forall_order_dependent,
# thm_5_3_is_exactly_existential -- are the same propositions over the same
# intManifold and the same operator instances that PrincipiaVol1 section 14
# already carries, alongside five more it does not.  Keeping both put the same
# proof in two places inside one repo, which is the mechanism that produced
# the V6 drift.  Dropped; nothing is lost.  Verified by comparing statements,
# not names, on 2026-08-25.
defaultTargets = ["PrincipiaVol1", "AutophagyDm3_v2"]

# Pinned by REVISION, not by tag.
#
# This previously read rev = "v4.14.0". A tag can be moved; a revision cannot.
# CHANGES_Vol1.md already states the rule -- "Toolchain and Mathlib revision
# now pinned and stated. 'Current stable' is not a pin" -- and PrincipiaVol1's
# header already names this exact hash. lake-manifest.json confirms the tag
# resolved here, so this edit changes nothing about what is built and removes
# the tag's ability to drift under the code later. Silent drift under an
# unchanged pin is what produced V6's 81 errors.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "4bbdccd9c5f862bf90ff12f0a9e2c8be032b9a84"

[[lean_lib]]
name = "PrincipiaVol1"

# Added 2026-08-25. Not a duplicate of anything: distinct theorems, its own
# namespace, and it is the merge of the two divergent copies that were on
# disk. Verified before landing -- 24 theorems, 0 sorry, 0 vacuous, and the
# one Prop-definition in it now mentions its own argument.
[[lean_lib]]
name = "AutophagyDm3_v2"
